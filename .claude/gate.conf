# Stage-0 gate commands (read by .claude/scripts/gate.sh; bash syntax).
# A gate runs only when the changed files include its language. Leave a line empty to mark it unconfigured:
# changes in that language then report "partial", and verification goes to Opus (stage 2).
# Every command runs from the project root in bash (Git Bash on Windows). Exit code 0 = pass.

# ---- C / C++ (Cesium Native etc.) ------------------------------------------
# GATE_CPP='cmake --build build --parallel && ctest --test-dir build --output-on-failure'
GATE_CPP=''
# Extra gate for C/C++ changes (e.g. an ASan/UBSan build). TSan for concurrency-heavy work.
# GATE_CPP_SANITIZE='cmake --build build-asan --parallel && ctest --test-dir build-asan --output-on-failure'
GATE_CPP_SANITIZE=''

# ---- C# (non-Unity) ----------------------------------------------------------
# GATE_CSHARP='dotnet build -warnaserror && dotnet test --no-build'
# DaouCalendarOverlay: 빌드 경고 0 규칙이라 -warnaserror. 테스트는 방금 빌드한 Release 산출물로 돈다.
GATE_CSHARP='dotnet build DaouCalendarOverlay.sln -c Release -warnaserror -nologo -v q && dotnet test DaouCalendarOverlay.sln -c Release --no-build -nologo'

# ---- Unity (used instead of GATE_CSHARP when ProjectSettings/ProjectVersion.txt exists) ----
# The editor must NOT have this project open; batchmode can't open a project that is in use.
# Use a separate worktree, or close the editor while the gate runs. Do not add -quit with -runTests.
# UNITY="/c/Program Files/Unity/Hub/Editor/6000.0.40f1/Editor/Unity.exe"
# GATE_UNITY='"$UNITY" -batchmode -nographics -projectPath . -runTests -testPlatform EditMode -testResults .claude/logs/gate/editmode.xml -logFile .claude/logs/gate/unity.log'
GATE_UNITY=''

# ---- JS / TS (CesiumJS apps, tools) ------------------------------------------
# GATE_JS_TS='npx tsc --noEmit && npx eslint . --max-warnings 0 && npx vitest run'
# DaouCalendarOverlay: JS는 Chrome 확장 worker뿐이고 npm 도구가 없다. 구문만 확인하고,
# worker 내용 검사(ChromeExtensionPackagingTests)는 GATE_ALWAYS의 dotnet test가 맡는다.
GATE_JS_TS='for f in DaouCalendarOverlay/ChromeExtension/*.js tools/*.js; do [ -f "$f" ] || continue; node --check "$f" || exit 1; done'

# ---- Rust --------------------------------------------------------------------
# GATE_RUST='cargo clippy --all-targets -- -D warnings && cargo test'
GATE_RUST=''
# Runs only when the diff adds a line with `unsafe`.
# GATE_RUST_MIRI='cargo +nightly miri test'
GATE_RUST_MIRI=''

# ---- Python ------------------------------------------------------------------
# GATE_PYTHON='ruff check . && pyright && pytest -q'
GATE_PYTHON=''

# ---- Always (when anything changed) ------------------------------------------
# e.g. validate converted 3D output:
# GATE_ALWAYS='npx 3d-tiles-validator --tilesetFile out/tileset.json && npx gltf-validator out/model.glb'
# DaouCalendarOverlay: 기술 문서 HTML 형식 점검, 그리고 .cs 변경 없이 문서·worker·csproj 등만 바뀐 경우의
# 빌드·테스트(문서 테스트와 worker 문자열 테스트가 C# 테스트 프로젝트에 있다). 세부는 gate-extra.sh.
GATE_ALWAYS='bash .claude/scripts/gate-extra.sh'

# ---- Behavior ----------------------------------------------------------------
GATE_MAX_BLOCKS=3      # how many times the hook sends an implementer back before letting it stop
GATE_OUTPUT_TAIL=60    # lines of output kept per failing gate
